[package]
name = "dank_scanner"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
arboard = "3.3"
tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "socks", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.30", features = ["bundled"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
crossbeam-channel = "0.5"
trust-dns-resolver = "0.23.2"
base64 = "0.21"
image = "0.24"
tokio-socks = "0.5"


